[project]
name = "market-replay"
version = "0.1.0"
description = "Strategy-agnostic, local-first evaluator for trading agents on replayed and generated onchain market episodes."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<0.142",
  "uvicorn>=0.30,<0.40",
  "pydantic>=2.8,<3",
  "httpx>=0.27,<0.29",
  "pyyaml>=6.0,<7",
  "mcp>=1.10,<2",
  "typer>=0.12,<0.20",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
historical = [
  "duckdb>=1.0,<2",
  "pyarrow>=17,<22",
]
dev = [
  "pytest>=8.2,<9",
  "pytest-timeout>=2.3,<3",
  "hypothesis>=6.100,<7",
  "ruff>=0.5,<0.15",
  "mypy>=1.10,<2",
  "playwright>=1.45,<2",
]

[project.scripts]
market-replay = "market_replay.cli.main:app"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_replay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 600
addopts = "-q"
markers = ["browser: playwright browser smoke tests", "slow: long-running full-week tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests", "sdk/python", "agents"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501", "E741"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
