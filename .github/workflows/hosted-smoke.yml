name: hosted-smoke

# Probes a deployed Market Replay (UI + function) without any credentials.
# Runs automatically when Vercel reports a deployment as successful (production and previews),
# and on demand from the Actions tab with any base URL.

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Deployment base URL, e.g. https://memeval-web.vercel.app"
        required: true
        default: "https://memeval-web.vercel.app"

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE: ${{ inputs.base_url || github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
    steps:
      - name: Probe
        run: |
          set -u
          echo "Deployment: ${{ github.event.deployment.environment || 'manual' }} -> $BASE"
          fail=0
          probe() {  # name method path expected_status [body]
            local name=$1 method=$2 path=$3 want=$4 body=${5:-}
            local out code
            if [ -n "$body" ]; then
              out=$(curl -sS -m 120 -X "$method" -H 'content-type: application/json' -d "$body" -o /tmp/body -w '%{http_code}' "$BASE$path" || echo 000)
            else
              out=$(curl -sS -m 120 -X "$method" -o /tmp/body -w '%{http_code}' "$BASE$path" || echo 000)
            fi
            code=$out
            printf '%-32s %s %-28s -> %s (want %s)\n' "$name" "$method" "$path" "$code" "$want"
            head -c 400 /tmp/body; echo; echo
            [ "$code" = "$want" ] || fail=1
          }
          probe "function: health"        GET  /api/v1/health          200
          probe "function: meta (public)" GET  /api/v1/meta            200
          probe "function: packs (public)" GET /api/v1/packs           200
          probe "function: import gate"   POST /api/v1/packs/import    401 '{"path":"/nowhere"}'

          probe "agent plane: http gate"  POST /agent/v1/commands      401 '{"request_id":"smoke","tool":"session.describe","arguments":{}}'
          # MCP is open (enroll needs no credential); a session tool without a token gets a typed error, never data
          mcp=$(curl -sS -m 60 -X POST "$BASE/agent/mcp" -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' \
                -d '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"portfolio_get","arguments":{"arguments":{}}}}')
          printf '%-32s %s %-28s -> %s\n' "agent plane: mcp token gate" POST /agent/mcp "$(echo "$mcp" | head -c 300)"
          echo "$mcp" | grep -q '"UNAUTHORIZED"' || fail=1
          probe "skill: served"           GET  /skill.md               200
          probe "skill: join link"        GET  /join                   200
          probe "leaderboard"             GET  /api/v1/leaderboard     200
          probe "skill: script"           GET  /skill/market_replay_agent.py 200
          probe "ui: index"               GET  /                       200
          probe "ui: client route"        GET  /agents                 200
          probe "ui: missing asset"       GET  /assets/nope.js         404
          exit $fail

      # Self-serve stage: start one complete reference-participant run on the 2-hour fixture the way
      # any visitor can (no credential), then read its report keys and the usage counters.
      - name: Full self-serve run
        run: |
          set -eu
          hdr=(-H 'content-type: application/json')
          run=$(curl -sS -m 280 "${hdr[@]}" -X POST "$BASE/api/v1/runs" -d '{"agent":{"name":"smoke_random_actions","version":"1","runtime":"python"},"pack_id":"gen_dev_short","agent_seed":"1","launch":{"name":"random_actions","runtime":"python"}}')
          echo "$run" | jq '{run_id, state, error, agent_name}'
          rid=$(echo "$run" | jq -r .run_id)
          state=$(echo "$run" | jq -r .state)
          [ "$state" = "completed" ] || { echo "run did not complete: $state"; exit 1; }
          curl -sS -m 60 "$BASE/api/v1/runs/$rid/report" | jq 'keys'
          curl -sS -m 60 "$BASE/api/v1/usage" | jq .
          # an anonymous caller must not get the unredacted export
          code=$(curl -sS -m 60 -o /dev/null -w '%{http_code}' "$BASE/api/v1/runs/$rid/export?role=admin")
          [ "$code" = "401" ] || { echo "admin export was not protected: $code"; exit 1; }

      # The skill, followed literally: download the served script and let it enroll and play an episode.
      - name: Agent follows the skill
        run: |
          set -eu
          curl -sSfO "$BASE/skill/market_replay_agent.py"
          python3 market_replay_agent.py --server "$BASE" --agent smoke-skill-bot --version 1 --suite generated-dev-v1 | tee out.txt
          grep -q "finished at" out.txt

      # Only on demand: a full run per recorded week takes a while.
      - name: Agent runs every recorded week through the skill script
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -u
          curl -sSfO "$BASE/skill/market_replay_agent.py"
          for pid in $(curl -sS -m 60 "$BASE/api/v1/packs" | jq -r '.items[] | select(.origin=="historical_reconstruction" and .use_status=="research") | .pack_id'); do
            echo "== running on $pid"
            python3 market_replay_agent.py --server "$BASE" --agent smoke-real-week-bot --version 1 --pack "$pid" | tee "run_$pid.txt"
            grep -q "finished at" "run_$pid.txt" || { echo "run on $pid did not finish"; exit 1; }
          done
      - name: Validation report of every recorded week
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -u
          for pid in $(curl -sS -m 60 "$BASE/api/v1/packs" | jq -r '.items[] | select(.origin=="historical_reconstruction") | .pack_id'); do
            echo "== $pid"
            curl -sS -m 120 "$BASE/api/v1/packs/$pid/validation" | jq '{resulting_qualification, gates: [.gates[] | {gate, status, detail}], reconciliation: (.gates[] | select(.gate=="execution_state") | .reconciliation | {checkpoints, mismatch_count, fidelity_flag_count, recorded_output_below_model_max, mismatches: (.mismatches[0:8]), fidelity_flags: (.fidelity_flags[0:8])})}'
            curl -sS -m 120 "$BASE/api/v1/packs/$pid" | jq '{use_status, summary: {pools_total: .summary.pools_total, pools_executable: .summary.pools_executable, tape_events: .summary.tape_events, coverage_states: .summary.coverage_states, executable_failure: .summary.executable_failure, unsupported: (.summary.unsupported_inventory[0:5])}}'
          done
