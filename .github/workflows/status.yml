name: status

# On-demand status of the hosted server: push anything to the `status-probe` branch (Vercel does not
# deploy that branch, see vercel.json) and read the job log. Prints every recorded week the site
# serves, the gate summary of each, and the leaderboard tabs.

on:
  push:
    branches: [status-probe]
  workflow_dispatch:

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE: ${{ vars.MARKET_REPLAY_URL || 'https://memeval-web.vercel.app' }}
    steps:
      - name: Recorded weeks and their gate summary
        run: |
          set -u
          curl -sS -m 60 "$BASE/api/v1/packs" | jq '[.items[] | select(.origin=="historical_reconstruction") | {name, use_status, period, pools_executable: .summary.pools_executable, tape_events: .summary.tape_events, gates: [.summary.gates[] | select(.status!="passed")]}]'
      - name: Validation detail of weeks that do not qualify
        run: |
          set -u
          for pid in $(curl -sS -m 60 "$BASE/api/v1/packs" | jq -r '.items[] | select(.origin=="historical_reconstruction" and .use_status=="diagnostic_only") | .pack_id'); do
            echo "== $pid"
            curl -sS -m 200 "$BASE/api/v1/packs/$pid/validation" | jq '{resulting_qualification, gates: [.gates[] | select(.status!="passed") | {gate, status, detail, pools_missing_initial_state, reconciliation: (.reconciliation // {} | {checkpoints, mismatch_count, fidelity_flag_count, reserve_adjustments, mismatches: (.mismatches // [] | .[0:5]), fidelity_flags: (.fidelity_flags // [] | .[0:8])})}]}'
            curl -sS -m 120 "$BASE/api/v1/packs/$pid" | jq '{venues: .summary.universe.excluded_or_unsupported_counts, unsupported: (.summary.unsupported_inventory | map(select(.reason | test("wrapped") | not)) | .[0:8])}'
          done
      - name: Leaderboard categories
        run: |
          curl -sS -m 60 "$BASE/api/v1/leaderboard?all=true" | jq '{categories: [.categories[]? | {id, label}], rows: (.rows | length)}' || true
