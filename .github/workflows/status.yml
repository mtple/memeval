name: status

# On-demand status of the hosted server: push anything to the `status-probe` branch (Vercel does not
# deploy that branch, see vercel.json) and read the job log. Prints every real week and the validation
# report of every built one.

on:
  push:
    branches: [status-probe]
  workflow_dispatch:

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE: ${{ vars.MARKET_REPLAY_URL || 'https://memeval-web.vercel.app' }}
    steps:
      - name: Weeks
        run: |
          set -u
          curl -sS -m 60 "$BASE/api/v1/weeks" | jq '.items[] | {label, protocol, status, requests_used, request_budget, attempts, qualification, note, error, updated_at}'
      - name: Validation of built weeks
        run: |
          set -u
          for pid in $(curl -sS -m 60 "$BASE/api/v1/weeks" | jq -r '.items[] | select(.status=="built") | .pack_id'); do
            echo "== $pid"
            curl -sS -m 120 "$BASE/api/v1/packs/$pid/validation" | jq '{resulting_qualification, execution: (.gates[] | select(.gate=="execution_state") | {status, detail}), reconciliation: (.gates[] | select(.gate=="execution_state") | .reconciliation | {checkpoints, mismatch_count, fidelity_flag_count, reserve_adjustments, mismatches: (.mismatches[0:5]), fidelity_flags: (.fidelity_flags[0:5])})}'
            curl -sS -m 120 "$BASE/api/v1/packs/$pid" | jq '{use_status, pools_total: .summary.pools_total, pools_executable: .summary.pools_executable, tape_events: .summary.tape_events, demoted: (.summary.universe.excluded_or_unsupported_counts // {})}'
          done
      - name: Leaderboard categories
        run: |
          curl -sS -m 60 "$BASE/api/v1/leaderboard?all=true" | jq '{categories: [.categories[]? | {id, label}], rows: (.rows | length)}' || true
