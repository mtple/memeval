name: weeks-watch

# Keeps real-week collections moving and leaves a progress log every ten minutes. Vercel's cron
# does the same from inside the platform; this is the observable copy. Exits quickly when idle.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE: ${{ vars.MARKET_REPLAY_URL || 'https://memeval-web.vercel.app' }}
    steps:
      - name: Advance pending weeks
        run: |
          set -u
          list=$(curl -sS -m 60 "$BASE/api/v1/weeks") || { echo "server unreachable"; exit 0; }
          echo "$list" | jq -c '{enabled, items: [.items[] | {label, status, requests_used, request_budget, attempts, error}]}'
          pending=$(echo "$list" | jq '[.items[] | select(.status=="queued" or .status=="collecting")] | length')
          [ "$pending" -gt 0 ] || { echo "nothing pending"; exit 0; }
          for i in $(seq 1 7); do
            curl -sS -m 290 -X POST "$BASE/api/v1/weeks/tick?slice=200" | jq -c '.advanced | {label, status, requests_used, attempts, note: (.note // "" | .[0:200]), error}' || true
            st=$(curl -sS -m 60 "$BASE/api/v1/weeks" | jq -r '[.items[] | select(.status=="queued" or .status=="collecting")] | length')
            [ "$st" -gt 0 ] || break
          done
          curl -sS -m 60 "$BASE/api/v1/weeks" | jq '.items[] | {label, status, requests_used, request_budget, attempts, note, error}'
