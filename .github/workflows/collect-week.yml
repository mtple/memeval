name: collect-week

# Optional: record one real week from GitHub's runners instead of your own machine, and commit it.
# The same command works locally: `make week START=YYYY-MM-DD` (see docs/how-a-real-week-is-built.md).
#
# Start it from the Actions tab (week_start input), or push any commit to the `record-week` branch
# whose message contains the date, e.g. `git commit --allow-empty -m "record 2026-09-07"` then
# `git push -f origin HEAD:record-week` (Vercel never deploys that branch, see vercel.json).
#
# Secret: BASE_RPC_URL or RPC_URL (your read-only Base RPC endpoint). Nothing else; the finished week is committed
# to the default branch and the site registers it on its next deploy.

on:
  workflow_dispatch:
    inputs:
      week_start:
        description: "Week start (UTC date, YYYY-MM-DD). Empty = the most recent Monday whose week ended at least a day ago."
        required: false
        default: ""
  push:
    branches: [record-week]

permissions:
  contents: write
  actions: write  # a slice dispatches the next one

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      BASE_RPC_URL: ${{ secrets.BASE_RPC_URL || secrets.RPC_URL }}
    steps:
      - name: Check secrets
        run: |
          if [ -z "$BASE_RPC_URL" ]; then echo "neither BASE_RPC_URL nor RPC_URL secret is set; nothing to record." ; exit 1; fi
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv sync --extra dev
      - name: Pick the week
        id: pick
        env:
          WEEK_START: ${{ inputs.week_start }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          start=$(python3 -c "
          import datetime as dt, os, re
          ws = os.environ.get('WEEK_START') or ''
          if not ws:
              m = re.search(r'\b(\d{4}-\d{2}-\d{2})\b', os.environ.get('COMMIT_MESSAGE') or '')
              ws = m.group(1) if m else ''
          if ws:
              print(ws)
          else:
              today = dt.datetime.now(dt.timezone.utc).date()
              monday = today - dt.timedelta(days=today.weekday())
              start = monday - dt.timedelta(days=7)
              while (dt.datetime.now(dt.timezone.utc).date() - (start + dt.timedelta(days=7))).days < 1:
                  start -= dt.timedelta(days=7)
              print(start.isoformat())")
          echo "start=$start" >> "$GITHUB_OUTPUT"
          echo "recording the week of $start"
      - name: Survey only (commit message starts with "survey")
        if: startsWith(github.event.head_commit.message, 'survey')
        run: |
          uv run market-replay survey --start "${{ steps.pick.outputs.start }}" | tee survey.json
          echo "SURVEY_ONLY=1" >> "$GITHUB_ENV"
      - name: Keep the survey
        if: startsWith(github.event.head_commit.message, 'survey')
        uses: actions/upload-artifact@v4
        with:
          name: survey_${{ steps.pick.outputs.start }}
          path: survey.json
          retention-days: 3
      - name: "Stats only (commit message starts with stats): size the tape from the cached logs, no RPC"
        if: startsWith(github.event.head_commit.message, 'stats')
        uses: actions/cache/restore@v4
        with:
          path: weeks/base_week_${{ steps.pick.outputs.start }}_work
          key: week-work-${{ steps.pick.outputs.start }}-none
          restore-keys: week-work-${{ steps.pick.outputs.start }}-
      - name: Stats
        if: startsWith(github.event.head_commit.message, 'stats')
        run: |
          du -sh weeks/base_week_${{ steps.pick.outputs.start }}_work || true
          uv run python scripts/launch_log_stats.py weeks/base_week_${{ steps.pick.outputs.start }}_work | tee stats.json
          echo "SURVEY_ONLY=1" >> "$GITHUB_ENV"
      - name: Keep the stats
        if: startsWith(github.event.head_commit.message, 'stats')
        uses: actions/upload-artifact@v4
        with:
          name: stats_${{ steps.pick.outputs.start }}
          path: stats.json
          retention-days: 3
      - name: "Trial only (commit message starts with trial): one day, kept as an artifact, never committed"
        if: startsWith(github.event.head_commit.message, 'trial')
        run: |
          set -u
          end=$(python3 -c "import datetime as dt; print((dt.date.fromisoformat('${{ steps.pick.outputs.start }}') + dt.timedelta(days=1)).isoformat())")
          uv run market-replay week --start "${{ steps.pick.outputs.start }}" --end "$end" --out trial || true
          echo "TRIAL_ONLY=1" >> "$GITHUB_ENV"
          du -sh trial/* 2>/dev/null || true
          ls -la trial/*/ 2>/dev/null || true
      - name: Keep the trial
        if: startsWith(github.event.head_commit.message, 'trial')
        uses: actions/upload-artifact@v4
        with:
          name: trial_${{ steps.pick.outputs.start }}
          path: |
            trial/*/manifest.yaml
            trial/*/inventory.json
            trial/*/validation.json
            trial/*_work/last_result.json
          if-no-files-found: ignore
          retention-days: 3
      - name: Restore working files from an earlier attempt (the recording resumes from its checkpoints)
        if: env.SURVEY_ONLY != '1' && env.TRIAL_ONLY != '1'
        uses: actions/cache/restore@v4
        with:
          path: weeks/base_week_${{ steps.pick.outputs.start }}_work
          key: week-work-${{ steps.pick.outputs.start }}-${{ github.run_id }}
          restore-keys: week-work-${{ steps.pick.outputs.start }}-
      - name: Runner resources before
        if: env.SURVEY_ONLY != '1' && env.TRIAL_ONLY != '1'
        run: df -h /home/runner && free -m
      - name: Record the week in a 40-minute slice (read-only, budgeted, resumable)
        id: record
        if: env.SURVEY_ONLY != '1' && env.TRIAL_ONLY != '1'
        run: |
          set +e
          uv run market-replay week --start "${{ steps.pick.outputs.start }}" --max-minutes 40
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "exit code $rc (0 = week built, 3 = slice expired and the next slice is dispatched below)"
      - name: Runner resources after
        if: env.SURVEY_ONLY != '1' && env.TRIAL_ONLY != '1'
        run: df -h /home/runner && free -m && du -sh weeks/* 2>/dev/null || true
      - name: Keep the working files for the next slice (they are deleted once the week is built)
        if: env.SURVEY_ONLY != '1' && env.TRIAL_ONLY != '1' && steps.record.outputs.rc != '0'
        uses: actions/cache/save@v4
        with:
          path: weeks/base_week_${{ steps.pick.outputs.start }}_work
          key: week-work-${{ steps.pick.outputs.start }}-${{ github.run_id }}
      - name: Dispatch the next slice
        if: env.SURVEY_ONLY != '1' && env.TRIAL_ONLY != '1' && steps.record.outputs.rc == '3'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run collect-week.yml --ref main -f week_start="${{ steps.pick.outputs.start }}"
          echo "next slice dispatched; this run ends here"
      - name: Fail if the recording stopped for any other reason
        if: env.SURVEY_ONLY != '1' && env.TRIAL_ONLY != '1' && steps.record.outputs.rc != '0' && steps.record.outputs.rc != '3'
        run: exit 1
      - name: Keep the week as an artifact (in case the push below fails)
        if: env.SURVEY_ONLY != '1' && env.TRIAL_ONLY != '1' && steps.record.outputs.rc == '0'
        uses: actions/upload-artifact@v4
        with:
          name: base_week_${{ steps.pick.outputs.start }}
          path: weeks/base_week_${{ steps.pick.outputs.start }}
          if-no-files-found: ignore
          retention-days: 3
      - name: Commit the week
        if: env.SURVEY_ONLY != '1' && env.TRIAL_ONLY != '1' && steps.record.outputs.rc == '0'
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weeks/
          git commit -m "Base week of ${{ steps.pick.outputs.start }}" || { echo "nothing new to commit"; exit 0; }
          # main may have moved while the week was recording: put the commit on top of it, then push
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort; echo "rebase failed"; exit 1; }
            git push origin HEAD:main && exit 0
            echo "push rejected (attempt $attempt); retrying"
            sleep 5
          done
          exit 1
