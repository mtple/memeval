name: collect-continuous-week
run-name: Continuous week ${{ inputs.start }} to ${{ inputs.end }} / slice ${{ inputs.slice }}

# Separate from collect-week and record-week. This workflow never pushes a branch,
# modifies daily packs, or runs the interactive simulator as a service.
on:
  workflow_dispatch:
    inputs:
      start:
        description: "Inclusive UTC start date"
        required: true
        default: "2026-09-07"
      end:
        description: "Exclusive UTC end date, exactly seven days after start"
        required: true
        default: "2026-09-14"
      max_requests:
        description: "Cumulative RPC request cap across all slices, including retries"
        required: true
        default: "40000"
      continue_slices:
        description: "Dispatch the next bounded slice after a clean checkpoint"
        type: boolean
        default: true
      publish:
        description: "Upload a validated indexed week privately; catalog registration requires separate runtime evidence"
        type: boolean
        default: false
      storage_budget_bytes:
        description: "Confirmed remaining Storage allowance in bytes; inspect current project usage before publishing"
        required: true
        default: "750000000"
      slice:
        description: "Continuation number. Leave at 1 for a manual start."
        required: true
        default: "1"

permissions:
  contents: read
  actions: write

concurrency:
  group: continuous-week-v1-${{ inputs.start }}-${{ inputs.end }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      BASE_RPC_URL: ${{ secrets.BASE_RPC_URL || secrets.RPC_URL }}
      WEEK_START: ${{ inputs.start }}
      WEEK_END: ${{ inputs.end }}
      MAX_REQUESTS: ${{ inputs.max_requests }}
      SLICE_NUMBER: ${{ inputs.slice }}
      PUBLISH: ${{ inputs.publish }}
      STORAGE_BUDGET_BYTES: ${{ inputs.storage_budget_bytes }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SECRET_KEY }}
    steps:
      - name: Require private repository and configured read-only RPC
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          set -eu
          test "$REPOSITORY_PRIVATE" = true || { echo "Private collection caches require a private repository."; exit 1; }
          test -n "$BASE_RPC_URL" || { echo "The existing RPC_URL or BASE_RPC_URL secret is missing."; exit 1; }
          if [ "$PUBLISH" = true ]; then
            test -n "$SUPABASE_URL" && test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "Existing Supabase Storage credentials must be configured before a publishing job starts."; exit 1; }
          fi
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
      - name: Install existing dependencies
        run: uv sync --extra dev --frozen
      - name: Validate inputs before selecting private cache paths
        id: inputs
        run: |
          uv run python - <<'PY'
          import datetime as dt
          import os
          start = dt.date.fromisoformat(os.environ["WEEK_START"])
          end = dt.date.fromisoformat(os.environ["WEEK_END"])
          if str(start) != os.environ["WEEK_START"] or str(end) != os.environ["WEEK_END"] or end - start != dt.timedelta(days=7):
              raise SystemExit("Use exact YYYY-MM-DD dates seven days apart.")
          if not 1 <= int(os.environ["SLICE_NUMBER"]) <= 8 or int(os.environ["MAX_REQUESTS"]) <= 0 or int(os.environ["STORAGE_BUDGET_BYTES"]) <= 0:
              raise SystemExit("Invalid slice number or cumulative RPC cap.")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"key=continuous-week-v1-{start}-{end}\n")
              output.write(f"root=data/continuous-week-v1/{start}_{end}\n")
          PY
      - name: Restore this weekly job's private checkpoints
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.inputs.outputs.root }}
          key: ${{ steps.inputs.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.inputs.outputs.key }}-
      - name: Require the saved budget for an automatic continuation
        env:
          WORK_ROOT: ${{ steps.inputs.outputs.root }}
        run: |
          set -eu
          if [ "$SLICE_NUMBER" != 1 ] && [ ! -f "$WORK_ROOT/rpc-budget.json" ]; then
            echo "Continuation checkpoint is missing. Stopping before RPC; do not restart the cumulative budget."
            exit 1
          fi
      - name: Collect and validate a bounded slice
        id: collect
        env:
          WORK_ROOT: ${{ steps.inputs.outputs.root }}
        run: |
          set +e
          publish_args=()
          if [ "$PUBLISH" = true ]; then publish_args+=(--publish); fi
          uv run python scripts/collect_continuous_week.py --start "$WEEK_START" --end "$WEEK_END" --work-root "$WORK_ROOT" --max-requests "$MAX_REQUESTS" --max-minutes 40 --storage-budget-bytes "$STORAGE_BUDGET_BYTES" "${publish_args[@]}"
          result=$?
          echo "result=$result" >> "$GITHUB_OUTPUT"
          echo "Result $result: 0 validated and indexed, 3 resumable checkpoint, other values require inspection."
      - name: Save private collection state and cumulative budget
        if: always() && steps.collect.outcome != 'skipped' && steps.inputs.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.inputs.outputs.root }}
          key: ${{ steps.inputs.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Keep measurements for review
        if: always() && steps.inputs.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: continuous-week-measurements-${{ inputs.start }}-${{ github.run_id }}
          path: |
            ${{ steps.inputs.outputs.root }}/collection-profile.json
            ${{ steps.inputs.outputs.root }}/catalog-candidate.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Dispatch the next slice only after a clean checkpoint
        if: steps.collect.outputs.result == '3' && inputs.continue_slices && inputs.slice != '8'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run collect-continuous-week.yml --ref main -f start="$WEEK_START" -f end="$WEEK_END" -f max_requests="$MAX_REQUESTS" -f continue_slices=true -f publish="$PUBLISH" -f storage_budget_bytes="$STORAGE_BUDGET_BYTES" -f slice="$((SLICE_NUMBER + 1))"
      - name: Report a stopped or unfinished collection
        if: steps.collect.outputs.result != '0' && steps.collect.outputs.result != '3'
        run: |
          echo "Collection stopped. Review its private checkpoint and measurements; no retry or publication was scheduled."
          exit 1
      - name: Report the continuation limit
        if: steps.collect.outputs.result == '3' && inputs.slice == '8'
        run: |
          echo "Eight slices reached. Collection remains private and incomplete; review measured progress and the saved budget before continuing."
          exit 1
