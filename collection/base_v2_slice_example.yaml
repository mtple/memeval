# Example authorized, read-only collection config for the Base / Uniswap v2 research connector.
# Run: BASE_RPC_URL=https://... make collect ARGS="--config collection/base_v2_slice_example.yaml"
# The endpoint URL lives only in the environment variable named below.
rpc_url_env: BASE_RPC_URL
chain: base
protocol: uniswap_v2
# Frozen interval and discovery cohort, chosen before any flow is read.
period_start_utc: "2026-09-15T12:00:00Z"
period_end_utc:   "2026-09-15T12:30:00Z"
discovery_window_start_utc: "2026-09-14T12:00:00Z"
prehistory_hours: 1
# Deterministic, outcome-independent sampling rule. Options:
#   earliest_created_wrapped_native_pairs_v1      (pure creation order)
#   active_before_window_earliest_created_v1       (at least one swap strictly before the window, then creation order)
selection_rule: active_before_window_earliest_created_v1
max_pairs: 8
# Hard request budget for this collection (the collector stops and stays resumable when exhausted).
max_requests: 500
log_chunk_blocks: 2000
initial_state_lookback_blocks: 20000
availability_delay_ms: 4000
out_dir: packs/historical/base_v2_active_slice_2026-09-15T12
authorization_note: "Operator-authorized read-only collection from the official public Base RPC (mainnet.base.org) with a fixed request budget; public chain data; redistribution not cleared."
