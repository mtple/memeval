[project]
name = "market-replay-client"
version = "0.1.0"
description = "Thin HTTP client for the Market Replay agent plane."
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<0.29"]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["market_replay_client"]
